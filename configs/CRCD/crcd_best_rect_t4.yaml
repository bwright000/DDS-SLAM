# T4-VIABLE best = the CONFIRMED champion (novelty claims 1-3): uncertainty (Inc-1/2) + flow_agree gate
# + Charbonnier loss, on the improved-config base (curmap100 + decoder64). For when an A100 is unavailable.
#
# Two deliberate differences from the full champion (configs/CRCD/crcd_best_rect.yaml):
#  1. DROPS the deform-iters (claim #4): no deform_iters_scale, no map_route. The deform-iters runs up to ~300
#     current-frame map iterations/frame -> 26 s/it AND the OOM that killed C1_001_best at frame 128 on a 15GB T4.
#     Claim #4 was CONDITIONAL and already did NOT beat the uniform-iters control on c1_001, so it is reported as
#     that standalone result, not carried across the (resource-limited) 5-snippet benchmark.
#  2. RAFT-small (raft_small: true) instead of RAFT-large -> frees ~2-3GB GPU so the gate's baseline doesn't tip
#     the keyframe-buffer growth over the T4 ceiling. Caveat: slightly changes the gate's disagree vs RAFT-large
#     (note it when comparing to the c1_001 raw-left flow_agree numbers).
#
# So this run isolates exactly claims 1-3 (uncertainty + label-free flow gate + robust loss) vs base.
inherit_from: configs/CRCD/crcd_improved_rect.yaml
uncertainty:
  enable: true
  hidden_dim: 32
  num_layers: 2
  nll_weight: 0.1
  w_min: 0.1
  w_max: 10.0
  detach_pose_weight: true
flow_track:
  enable: true
  gate: true
  agreement: true
  ref_stride: 8
  cam_thresh: 2.0
  disagree_thresh: 0.2
  deadband: 3.0
  n_groups: 12
  ransac_thresh: 1.0
  raft_small: true        # T4 fix: RAFT-small (~5x lighter GPU) so the gate baseline doesn't OOM at ~frame 128
  freeze_ba: true
training:
  rgb_loss_type: charbonnier
  charbonnier_eps: 0.01
# (no mapping.deform_iters_scale -> defaults 0 = no deform-iters; no map_route -> defaults off; cur_frame_iters
#  stays 100 from crcd_improved_rect, same as the base arm = same map-opt cost.)
