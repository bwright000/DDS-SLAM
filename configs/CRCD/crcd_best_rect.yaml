# RECTIFIED-BENCHMARK CHAMPION (snippet-agnostic) = best_deformiters + Charbonnier loss.
# = crcd_improved_rect (authors' canon + lr1e-4 + curmap100 + decoder64/3)
#   + uncertainty (Inc-1 aleatoric sigma^2 head + Inc-2 1/sigma^2 tracking down-weight)
#   + flow_track (flow_agree camera/scene gate + agreement + freeze_ba)
#   + map_route(mode pixel) + mapping.deform_iters_scale 200  (deformation-adaptive map iterations)
#   + training.map_upweight 2.0  (carried from best_combine; confirmed inert on the SDF substrate)
#   + training.rgb_loss_type charbonnier  (the robust-loss render win: +0.15 PSNR / +0.006 SSIM on c1_001)
# Reproduces c1_001_canon_best_deformiters + c1_001_canon_best_charbonnier, made snippet-agnostic for the
# rectified 5-snippet benchmark (the runbook injects per-snippet datadir/timesteps/bound/rectified-intrinsics).
inherit_from: configs/CRCD/crcd_improved_rect.yaml
uncertainty:
  enable: true
  hidden_dim: 32
  num_layers: 2
  nll_weight: 0.1
  w_min: 0.1
  w_max: 10.0
  detach_pose_weight: true
flow_track:
  enable: true
  gate: true
  agreement: true
  ref_stride: 8
  cam_thresh: 2.0
  disagree_thresh: 0.2
  deadband: 3.0
  n_groups: 12
  ransac_thresh: 1.0
  raft_small: false
  freeze_ba: true
map_route:
  enable: true
  mode: pixel                  # per-pixel homography residual -> moving-frac for the deform-iter scale
  ref_stride: 8
  deadband: 3.0
  n_groups: 12                 # inert in pixel mode; carried for fidelity with best_deformiters
  smooth: 5
  soft_scale: 2.0
  ransac_thresh: 1.0
mapping:
  deform_iters_scale: 200      # n_iters = cur_frame_iters(100) + 200*moving_frac
training:
  map_upweight: 2.0            # inert on the SDF substrate (carried from best_combine for fidelity)
  rgb_loss_type: charbonnier   # robust pseudo-Huber RGB loss (down-weights specular outliers)
  charbonnier_eps: 0.01
