# Inc-1 v2 — WildGS-FAITHFUL DINO uncertainty on CRCD c1_001.
# The DINO head trains across the WHOLE scene (online, self-supervised), the way WildGS-SLAM does:
#   - compact DINO patch-grid stored per frame, bilinear-SAMPLED on-demand at the rays (no per-pixel
#     buffer, no keyframe-DB bloat); global_BA stays DINO-free.
#   - head trained every frame via current_frame mapping (cur_frame_iters>0) -> sees all frames.
# Compare against c1_001_base_wgs (SAME cur_frame_iters) to isolate the DINO effect.
# NB this is a DIFFERENT mapping regime than the canon (cur_frame_iters:0, global_BA-trained); the
# geo(v1) result was on the canon, so v2-vs-v1 is NOT apples-to-apples here. v2-vs-base_wgs IS.
# PREREQ: bake DINO -> data/CRCD/C1_001/dino/*_dino.npy  (Addons/dino/generate_dino_features.py --fp32)
inherit_from: configs/CRCD/c1_001_canon_uncert_dino.yaml
data:
  output: output/CRCD/c1_001_dino_wgs
  exp_name: demo
mapping:
  cur_frame_iters: 10        # head trains per-frame across the scene (canon was 0 -> frame-0 only)
