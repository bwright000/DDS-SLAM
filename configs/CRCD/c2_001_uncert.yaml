# C_2/001 ARM-2 A/B VARIANT (uncertainty ON: Inc-1 + Inc-2). The TRACKING hedge test.
# C_2/001 is the largest-motion CRCD snippet (~29x11x17 mm) -> best chance of a tracking
# signal above the sub-SNR floor. Inc-1: learnt per-ray aleatoric sigma^2 (mirrors edge head),
# trained self-supervised via NLL on the mapping residual. Inc-2: TRACKING-ONLY pose down-weight
# weights=clip(1/sigma^2,w_min,w_max).detach() into rgb/depth compute_loss (linear, not the *w trick).
# A/B vs c2_001_uncert_base.yaml. CRCD sub-SNR -> quote ATE(Sim3) + est/GT path ratio +
# dominant-axis Pearson + PSNR/SSIM/LPIPS, NOT ATE alone. Deformation field untouched (this is the hedge).
inherit_from: configs/CRCD/c2_001_paperfaith_lrfix.yaml
data:
  output: output/CRCD/C2_001_uncert
  exp_name: demo
uncertainty:
  enable: true
  hidden_dim: 32
  num_layers: 2
  nll_weight: 0.1
  w_min: 0.1
  w_max: 10.0
  detach_pose_weight: true
