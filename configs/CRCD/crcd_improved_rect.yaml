# RECTIFIED-BENCHMARK improved config TEMPLATE (snippet-agnostic). = crcd_basecanon (authors' canon + surgical
# lr 1e-4) + the improved render levers (curmap100 cur_frame_iters 0->100 + decoder64/3). The 5-snippet rectified
# benchmark runbook INJECTS, per snippet: data.datadir + timesteps + mapping.{bound,marching_cubes_bound}
# (derived from THAT snippet's rectified MoGe depth) + cam.{fx,fy,cx,cy,H,W} (from rectified_calib.txt) +
