# MODE A ablation -- robust 2D-3D PnP camera-motion solve (the hardened new flow, per the internal review).
# RAFT flow + REF depth only (no D_cur double-noise; forward motion from radial looming) -> cv2.solvePnPRansac
# -> camera motion T_rel (up-to-scale, NOT a metric anchor). Used INIT-ONLY to seed the SDF tracker (which can
# overrule it; never a freeze/prior). Reprojection residual -> per-DINO-region trust weight -> the pose loss.
# flow_advance_px gates out below-noise-floor frames (fall back to const-velocity).
# TOOL-EXCLUSION: data.seg_label_subdir=semantic_class (below) points the tool label at the 4-class map (staged
# by preprocess_crcd_published) so batch['seg']==2 = the tool -> HARD-excluded from the PnP solve AND forced to
# w_min in the trust map (ddsslam). CRCD's default semantic_paths glob the BINARY masks/ (tool->2 remap fails),
# hence the decoupled label; if semantic_class is absent the dataset falls back to masks/ (RANSAC-only reject).
inherit_from: configs/CRCD/crcd_abl_base_rect.yaml
flow_track:
  enable: true
  mode: solve_pnp
  ref_stride: 8
  flow_advance_px: 1.5
  reproj_px: 2.0
  min_inliers: 200
  n_groups: 12
  mad_c: 2.0
  w_floor_px: 1.0
  w_min: 0.1
  raft_small: false
data:
  seg_label_subdir: semantic_class   # 4-class tool label (decoupled from the binary edge masks) -> real tool-exclusion
