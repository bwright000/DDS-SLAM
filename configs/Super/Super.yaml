dataset: 'super'
use_semantic: True
use_normal: False
dynamic: True
render_freq: 1
data:
  downsample: 1
  sc_factor: 1
  translation: 0
  num_workers: 0

mapping:
  sample: 2048
  first_mesh: True
  iters: 200
  lr_embed: 0.01
  lr_decoder: 0.01
  lr_rot: 0.0001
  lr_trans: 0.0001
  keyframe_every: 1
  map_every: 1
  n_pixels: 0.05
  first_iters: 1000
  optim_cur: True
  min_pixels_cur: 100
  map_accum_step: 1
  cur_frame_iters: 100
  pose_accum_step: 5
  map_wait_step: 0
  filter_depth: False
  mapping_window_size: 5

tracking:
  iter: 20
  sample: 1024
  pc_samples: 40960
  lr_rot: 0.0001
  lr_trans: 0.0001
  ignore_edge_W: 1
  ignore_edge_H: 1
  iter_point: 0
  wait_iters: 100
  const_speed: True
  best: True

grid: 
  enc: 'HashGrid' 
  tcnn_encoding: True
  hash_size: 16
  voxel_color: 0.0008 #0.08
  voxel_sdf: 0.0002 #0.02
  oneGrid: True

pos:
  enc: 'OneBlob'  #'OneBlob'
  n_bins: 16
  n_frequencies: 16

decoder:
  geo_feat_dim: 15
  hidden_dim: 32
  num_layers: 2
  num_layers_color: 2
  hidden_dim_color: 64
  hidden_dim_time: 128
  num_layers_time: 4
  tcnn_network: False
  learnable_beta: True

cam:
  H: 480
  W: 640
  fx: 768.98551924
  fy: 768.98551924
  cx: 292.8861567
  cy: 291.61479526
  png_depth_scale: 8.0          # INPUT-data convention: SemSup NPYs are stored as depth_m*8 (see Addons/depth/generate_depth_for_ddsslam.py). SuperDataset divides loaded depth by this. DO NOT change without regenerating the NPY corpus.
  output_depth_scale: 10000.0   # SAVE-only scale for rendered depth visualisation PNGs (ddsslam.py). Decoupled from png_depth_scale so save can be visualisation-friendly without breaking the input loader.
  crop_edge: 0
  near: 0
  far: 5
  depth_trunc: 5. #100.0

training:
  normal_weight: 0.000
  normal_loss: 0.000
  rgb_weight: 5
  semantic_weight: 0.5
  angle_loss_weight: 0
  depth_weight: 0.1  #0.1
  sdf_weight: 1000 #1000
  fs_weight: 10  #10
  eikonal_weight: 0
  smooth_weight: 0 #0.000001
  smooth_pts: 32
  smooth_vox: 0.1
  smooth_margin: 0.05
  #n_samples: 256
  n_samples_d: 32
  range_d: 0.1
  n_range_d: 11
  n_importance: 0
  perturb: 1
  white_bkgd: False
  trunc: 0.1
  rot_rep: 'axis_angle'
  rgb_missing: 0.05

mesh:
  resolution: 512
  render_color: False
  vis: 500
  voxel_eval: 0.03
  voxel_final: 0.03
  visualisation: False

# --- ARM-2 stack (Inc-0 plumbing; all default-OFF). When enable:false the modules
# are NOT constructed (scene_rep.get_decoder), so they consume ZERO torch RNG at build
# time => est_c2w + PSNR are bit-identical to base. Code reads every key via .get(...)
# so configs that do NOT inherit Super.yaml (StereoMIS/CRCD) stay safe too.
# Full design: Addons/docs/ARM2_STACK_DRAFT_20260614.md  diagram: Addons/docs/arm2_architecture.png
uncertainty:          # WildGS-style learnt attribution (Inc-1/2/3) — the learnt core
  enable: false
  hidden_dim: 32
  num_layers: 2
  w_min: 0.1          # pose down-weight clamp lo:  weights = clip(1/sigma^2, w_min, w_max)
  w_max: 10.0         # pose down-weight clamp hi
  route_c: 1.0        # a_ray = sigma^2 / (sigma^2 + route_c)
  route_lambda: 1.0   # eff_gate = max(a_ray, route_lambda * seg)   (lambda->0 = everything-learnt)
  detach_pose_weight: true
nrgs:                 # dual-hypothesis rigidity teacher (Inc-4, gated by the Inc-0.5 probe)
  enable: false
  alpha: 1.0          # seg-prior strength in w*
  beta: 1.0           # rigid-vs-deform residual strength in w*
  bce_weight: 1.0     # gate BCE supervision weight
  field_weight: 1.0   # w* * E_deform field supervision weight
  mask_def_reg: true  # mask def_reg by (1 - w*)  (ONE mask site)
sni:                  # one-way feature conditioning (Inc-5, optional)
  enable: false
  mode: film          # film (default) | xattn (larger-data / CRCD cell)
  feat_dim: 0

