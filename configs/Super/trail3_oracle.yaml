# ORACLE-FIELD, IN-PIPELINE (option C) -- the full ONLINE SLAM arm of the "given a CORRECT deformation
# field, does the render improve?" A/B. Static control = the parent (trail3_teacher_off: dead field,
# pose-frozen identity = the bake's gauge). This arm warps every MAP update (current_frame_mapping +
# global_BA via per-keyframe dx stored in the KF DB) AND the inline render by the BAKED teacher dx*
# (validated +86.2%/cos .935 vs the held-out pins), bypassing time_net entirely (oracle_dx seam).
# Tracking untouched (pose-frozen). Judge: run_cell.sh full kit -- PSNR/SSIM/LPIPS + 6-panel video --
# vs the teacher_off control run. Context: the OFFLINE A/B read oracle +0.38dB global but NOT
# motion-localised at an underfit operating point; this arm asks the same question under the paper's
# own online protocol and full training schedule.
# deform_target_scale <1 shrinks dx* toward the render band (|dx*|max 0.133 > trunc 0.1 hazard).
inherit_from: configs/Super/trail3_teacher_off.yaml
data:
  output: output/trail3_oracle
training:
  deform_oracle: true
