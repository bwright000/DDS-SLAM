# ARM-2 Stage-1 TEACHER arm: regress TimeNet toward the baked Δx* target (depth+DINO correspondence,
# validated +86.2%/cos0.935 at the held-out pins). The ONLY delta vs trail3_teacher_off is
# deformation_sup_weight (+ deform_subdir, inert when the weight is 0) -> a clean single-variable A/B.
# deform_subdir=deform -> data/Super/trail_3/deform/<stem>_deform.npz (baked at --grid_scale 3).
# weight=100 is the PRIMARY tunable: def_sup is a trust-weighted MSE ~1e-3 world^2, x100 ~ the depth-loss
# scale; sweep DOWN if the field over-deforms / render regresses, UP if revival is weak on the judge.
inherit_from: configs/Super/trail3_teacher_off.yaml
data:
  output: output/trail3_teacher_on
  exp_name: demo
  deform_subdir: deform
training:
  # v0 finding: global_BA collapses the field to 0 before the teacher acts. The two flags below make the
  # deformation field the TEACHER's sole trainee (out of global_BA; render-free current_frame_mapping) ->
  # def_sup drops 237x/frame, the field learns Δx*. weight is large because the teacher is now uncontested.
  deformation_sup_weight: 10000
  deform_field_teacher_only: true    # keep time_net OUT of global_BA's optimizer -> render loss can't collapse it (THE fix)
  deform_teacher_only: true          # current_frame_mapping loss = def_sup ALONE (no render competition on the field)
