# E0 (ARM-1 mapping push): ROUTE the alive deformation field to MOVING (tissue) regions only — in the
# mapper (current_frame_mapping) AND the render — using the flow-as-sensor region map (the INVERSE of the
# tracking gate). = trail3_teacher_replay_sharp (field alive via teacher+replay, cur_frame_map_only) + map_route ON.
# The field warps moving regions and is OFF on static/camera regions, so the un-routed global smear (~4 PSNR)
# is removed while the field stays alive. ARCHITECTURE-ONLY (no config/schedule tuning; same heavy SemSup
# schedule as the base arm). JUDGE: LIVE render (PSNR up toward 28) + pin-EPE alive (field_warped_pin_epe.py).
# SCOPE (E0 = smallest test; verified wf wm9jjwbla): routes current_frame_mapping + render + teacher-buffer.
# By design NOT YET routed: (1) global_BA (the dominant map trainer, iters=200) -> B1 (route its current-frame
# injection) / B2 (per-keyframe route storage) are the next rungs; the LIVE render should still reflect routing
# because current_frame_mapping (cur:100, dense+local) is the LAST map update before rendering. (2) tracking_render
# -> intentional (tracking owns the separate flow_track gate). If E0's live render only partially recovers, escalate to B1/B2.
inherit_from: configs/Super/trail3_teacher_replay_sharp.yaml
data:
  output: output/trail3_teacher_replay_sharp_route
  exp_name: demo
# NOTE: deform_hardbound (over-warp cap) DEFERRED out of this arm. At 0.02 the tanh clips legit deformations
# in the 0.02-0.08 range by 24-50% (targets reach 0.084) -> a real pin-EPE risk (the field underfits the large
# deformations). Keep this arm SOFT-ONLY (clean test of the soft-routing insight, no field-life risk). Probe
# the hardbound separately (safer value, watch pin-EPE) IF the over-warp persists; B2 (route global_BA) is the
# depth-spike ROOT regardless.
map_route:
  enable: true
  soft_scale: 2.0      # E0 v0.4 (user insight): SOFT routing -- apply the field PROPORTIONALLY to the camera-
                       #          subtracted residual (w ramps 0->1 over [deadband, deadband+soft_scale]) instead
                       #          of a hard on/off. Kills the black-and-white boundary blobs + degrades gracefully
                       #          when the route is slightly wrong. soft_scale=0 -> hard binary (old behaviour).
  mode: pixel          # E0 v0.3: FULL-RES per-pixel route via a HOMOGRAPHY consensus. Fixes BOTH (a) low-res bleed
                       #          (region mode = 14px-patch blobs that smear the field into bg) AND (b) camera ZOOM
                       #          read as deformation (the fundamental matrix is degenerate for forward/zoom; the
                       #          homography models rotation+zoom, so its per-pixel reprojection residual isolates
                       #          LOCAL deformation). region mode (DINO k-means + Sampson) kept for A/B.
  ref_stride: 8        # causal reference: RAFT flow from 8 frames back -> current frame
  deadband: 1.0        # per-pixel reprojection-residual threshold (px); >1 (above RANSAC inlier ceiling) = moving
  smooth: 5            # median-blur + morph kernel for the per-pixel route (denoise; edge-preserving)
  n_groups: 12         # (region mode only) DINO k-means regions
  ransac_thresh: 1.0
  # tissue_only_teacher: false  # (default) train the field on FULL targets so it stays ALIVE; route gates only application
