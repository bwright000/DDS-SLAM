# Inc-1 v2 (DINO) arm for SemSup trail3 (MoGe2 depth). Identical to trail3_moge2_uncert (Inc-1/2 ON)
# EXCEPT the uncertainty signal is per-PIXEL DINO features, not per-POINT geo_feat.
# PREREQ: precompute DINO features -> data/Super/trail_3/dino/<stem>_dino.npy
#   python Addons/dino/generate_dino_features.py --rgb_dir data/Super/trail_3/rgb \
#       --rgb_glob '*left.png' --out_dir data/Super/trail_3/dino --backbone dinov2_vits14
inherit_from: configs/Super/trail3_moge2_uncert.yaml
data:
  output: output/trail3_moge2_uncert_dino
  exp_name: demo
uncertainty:
  mode: dino
  dino_dim: 384
  dino_subdir: dino
  hidden_dim: 64
